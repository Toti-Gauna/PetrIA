name: infra

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  compose-smoke:
    name: Compose smoke test (Postgres + extensions, RabbitMQ)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Create the local .env from the example
        run: cp .env.example .env
      - name: Start the stack and wait for the healthchecks
        run: docker compose up -d --build --wait
      - name: PostGIS must answer
        run: |
          docker compose exec -T db sh -c "psql -U \"\$POSTGRES_USER\" -d \"\$POSTGRES_DB\" -v ON_ERROR_STOP=1 -tAc \"SELECT postgis_version();\""
      - name: pgvector must be installed
        run: |
          v=$(docker compose exec -T db sh -c "psql -U \"\$POSTGRES_USER\" -d \"\$POSTGRES_DB\" -v ON_ERROR_STOP=1 -tAc \"SELECT extversion FROM pg_extension WHERE extname = 'vector';\"")
          echo "pgvector version: $v"
          test -n "$v"
      - name: "Roles: the wall holds (0.2)"
        run: |
          docker compose exec -T db sh -c 'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"' < postgres/tests/roles_test.sql
      - name: "Roles: each service can log in with its own password"
        run: |
          # Read a value from the local .env file (dev-only values).
          envval() { grep "^$1=" .env | cut -d= -f2-; }
          db=$(envval POSTGRES_DB)
          for pair in ingest_svc:INGEST_SVC_PASSWORD ml_svc:ML_SVC_PASSWORD api_svc:API_SVC_PASSWORD rag_svc:RAG_SVC_PASSWORD; do
            user=${pair%%:*}; var=${pair##*:}
            # -h localhost forces a password check (not the trusted local socket).
            got=$(docker compose exec -T -e PGPASSWORD="$(envval "$var")" db \
                  psql -h localhost -U "$user" -d "$db" -tAc "SELECT current_user")
            echo "login as $user -> $got"
            test "$got" = "$user"
          done
      - name: Show logs if something failed
        if: failure()
        run: docker compose logs
      - name: Stop the stack and erase its volumes
        if: always()
        run: docker compose down -v

  web-image:
    name: Web image builds
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: docker build -t petria-web:ci .
