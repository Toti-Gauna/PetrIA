# Local playground: Postgres (PostGIS + pgvector) and RabbitMQ.
# Start:  docker compose up -d --build --wait     (from the infra/ folder)
# Stop:   docker compose down        (data stays: it lives in the volumes)
# Wipe:   docker compose down -v     (deletes the volumes, so the data too)
#
# Production uses Neon for Postgres; this stack is only for your own computer.
services:
  db:
    build: ./postgres
    env_file: .env
    ports:
      - "127.0.0.1:5432:5432"          # only reachable from this computer
    volumes:
      - pgdata:/var/lib/postgresql/data  # keeps the data after "down"
    healthcheck:
      # "started" is not "ready": ask Postgres if it accepts connections.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  rabbitmq:
    image: rabbitmq:3.13-management      # management UI on http://localhost:15672
    env_file: .env
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12

volumes:
  pgdata:
  rabbitmqdata:
